name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test --project unit
      - run: yarn typecheck

  shipped-artifacts:
    # The skill installs without a build, so the committed bundles must match
    # a fresh build of src/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn avalanche:sync
      - run: yarn chippy:mcp:build
      - name: Fail when committed bundles are stale
        run: git diff --exit-code -- .agents/skills/chippy

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn test --project browser

  package:
    # Pack the npm package and run its installer the way `npx` does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn chippy:library:build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the skill from the packed tarball
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes --package ./atlassian-chippy-*.tgz chippy install --dir "$RUNNER_TEMP/skill"
          test -f "$RUNNER_TEMP/skill/SKILL.md"
          test -f "$RUNNER_TEMP/skill/extension/manifest.json"
          test -f "$RUNNER_TEMP/skill/scripts/chippy-mcp.cjs"
